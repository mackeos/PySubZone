[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysubzone"
version = "0.1.1"
description = "Python API, CLI and TUI to search and download subtitles from subzone.ir (Subf2m subtitle database)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Mackeos", email = "29227187+mackeos@users.noreply.github.com" },
]
keywords = [
    "subzone",
    "subzone.ir",
    "subf2m",
    "subtitles",
    "subtitle-downloader",
    "subtitle-scraper",
    "srt",
    "farsi",
    "persian",
    "cli",
    "tui",
    "textual",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "requests>=2.25",
    "beautifulsoup4>=4.9",
    "lxml>=4.6",
    "typer>=0.9",
    "rich>=13.0",
    "textual>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
subz = "pysubzone.cli:main"

[project.urls]
Homepage = "https://github.com/mackeos/PySubZone"
Repository = "https://github.com/mackeos/PySubZone"
Issues = "https://github.com/mackeos/PySubZone/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
